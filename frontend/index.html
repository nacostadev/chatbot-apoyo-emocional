<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Inteligente de Evaluación Psicoemocional - UCV 2026</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container" id="appContainer">
        <header class="app-topbar" id="appTopbar">
            <button type="button" class="btn-menu-toggle" id="btnMenuToggle" aria-label="Abrir menú">
                <i data-lucide="menu"></i>
            </button>
            <div class="topbar-brand">
                <div class="topbar-avatar">
                    <i data-lucide="brain-circuit"></i>
                </div>
                <span>Sistema de Apoyo Emocional</span>
            </div>
        </header>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <div class="app-body">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="brand-wrapper">
                        <div class="brand-icon bot-pulse">
                            <i data-lucide="brain-circuit"></i>
                        </div>
                        <div class="brand-text">
                            <h1>Sistema de Apoyo Emocional</h1>
                            <p>Plataforma UCV</p>
                        </div>
                        <button type="button" class="btn-sidebar-close" id="btnSidebarClose" aria-label="Cerrar menú">
                            <i data-lucide="x"></i>
                        </button>
                    </div>
                    <div class="ods-badge">
                        <p class="ods-title">ODS 3: Salud y Bienestar</p>
                        <p class="ods-desc">Diagnóstico Psicoemocional</p>
                    </div>
                </div>

                <nav class="sidebar-nav">
                    <button type="button" class="nav-item active" data-view="chatbot" style="text-decoration: none; background: none; border: none; text-align: left; cursor: pointer;">
                        <i data-lucide="message-square-heart"></i>
                        <span>Chatbot de Diagnóstico</span>
                    </button>
                    <button type="button" class="nav-item" data-view="metricas" style="text-decoration: none; background: none; border: none; text-align: left; cursor: pointer;">
                        <i data-lucide="bar-chart-3"></i>
                        <span>Métricas del Proyecto</span>
                    </button>
                    <button type="button" class="nav-item" data-view="ficha" style="text-decoration: none; background: none; border: none; text-align: left; cursor: pointer;">
                        <i data-lucide="users-round"></i>
                        <span>Ficha e Investigadores</span>
                    </button>
                </nav>

                <div class="sidebar-footer">
                    <p>Investigación Académica VII Ciclo</p>
                    <p class="copyright">Universidad César Vallejo &copy; 2026</p>
                </div>
            </aside>

            <main class="content-shell">
                <iframe id="viewFrame" class="page-view-frame" title="Vista del sistema"></iframe>
            </main>
        </div>
    </div>

    <script>
        const frame = document.getElementById('viewFrame');
        const appContainer = document.getElementById('appContainer');
        const btnMenuToggle = document.getElementById('btnMenuToggle');
        const btnSidebarClose = document.getElementById('btnSidebarClose');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const navItems = document.querySelectorAll('.sidebar .nav-item');

        const views = {
            chatbot: 'pages/chatbot.html',
            metricas: 'pages/metricas.html',
            ficha: 'pages/ficha.html'
        };

        function openSidebar() {
            appContainer.classList.add('sidebar-open');
        }

        function closeSidebar() {
            appContainer.classList.remove('sidebar-open');
        }

        function setView(viewName) {
            const target = views[viewName] || views.chatbot;
            frame.src = target;
            const params = new URLSearchParams(window.location.search);
            params.set('view', viewName);
            const newUrl = `${window.location.pathname}?${params.toString()}`;
            window.history.replaceState({}, '', newUrl);
            navItems.forEach((item) => item.classList.toggle('active', item.getAttribute('data-view') === viewName));
        }

        btnMenuToggle.addEventListener('click', openSidebar);
        btnSidebarClose.addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);
        navItems.forEach((item) => {
            item.addEventListener('click', () => {
                setView(item.getAttribute('data-view'));
                closeSidebar();
            });
        });

        const params = new URLSearchParams(window.location.search);
        const initialView = params.get('view') || 'chatbot';
        setView(initialView);

        if (window.lucide) {
            lucide.createIcons();
        }
    </script>
</body>
</html>
